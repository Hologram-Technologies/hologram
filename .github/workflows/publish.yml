name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  # Verify version matches tag
  verify:
    name: Verify Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract version from tag
        id: tag_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1

      - name: Extract version from Cargo.toml
        id: version
        run: |
          # The shared workspace version (no package is named `hologram`).
          VERSION=$(scripts/workspace-version.sh)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify versions match
        run: |
          if [ "${{ steps.tag_version.outputs.version }}" != "${{ steps.version.outputs.version }}" ]; then
            echo "❌ Tag version (${{ steps.tag_version.outputs.version }}) does not match Cargo.toml version (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "✅ Version check passed: v${{ steps.version.outputs.version }}"

  # Run full test suite before publishing
  test:
    name: Test Before Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests
        # Exclude holospaces (mirrors ci.yml): its CC integration tests need the vv/artifacts
        # fixtures + Linux tools (qemu/e2fsprogs/docker); on a plain runner where a tool is present
        # but the fixture isn't, they fail instead of skipping. They're gated by release.yml's
        # holospaces-vv-heavy job (fixtures materialized), which the release tag also triggers.
        run: cargo test --workspace --exclude holospaces

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  # Build release binaries for multiple platforms
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hologram
            asset_name: hologram-linux-amd64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hologram
            asset_name: hologram-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hologram
            asset_name: hologram-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: hologram.exe
            asset_name: hologram-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # Drop the runner image's flaky third-party apt sources (see ci.yml)
          # so a broken packages.microsoft.com repo cannot abort the release.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources || true
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary (Linux with mold)
        if: runner.os == 'Linux'
        run: cargo build --release --bin hologram --features cli --target ${{ matrix.target }}
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Build release binary (non-Linux)
        if: runner.os != 'Linux'
        run: cargo build --release --bin hologram --features cli --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.asset_name }}.zip ${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.zip
          if-no-files-found: error

  # Create GitHub Release with binaries
  # Note: GitHub Packages does not currently support native Cargo registries
  # Users should consume these crates via git dependencies:
  #   hologram-exec = { git = "https://github.com/Hologram-Technologies/hologram", tag = "v0.1.0" }
  release:
    name: Create GitHub Release
    needs: [verify, build-binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1

      - name: Require the complete public package closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-public-release.py --version '${{ needs.verify.outputs.version }}'

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Display artifact structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          set -euo pipefail
          version='${{ needs.verify.outputs.version }}'
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          test "$commit" = "$(git rev-parse HEAD)"
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          scripts/create-source-release.sh "$version" release-assets
          ls -lh release-assets/

      - name: Attest source archive and commit manifest with keyless provenance
        id: attest-source
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-assets/hologram-source-v*.tar.gz
            release-assets/hologram-source-v*.json

      - name: Verify and stage source provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh attestation verify release-assets/hologram-source-v*.tar.gz --repo "$GITHUB_REPOSITORY"
          gh attestation verify release-assets/hologram-source-v*.json --repo "$GITHUB_REPOSITORY"
          cp '${{ steps.attest-source.outputs.bundle-path }}' release-assets/hologram-source-provenance.sigstore.json
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${{ needs.verify.outputs.version }}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          cat > release_notes.md << 'EOF'
          ## Hologram v${{ needs.verify.outputs.version }}

          ### Installation

          #### Via Git Dependency

          Add to your `Cargo.toml`:

          ```toml
          [dependencies]
          # Depend on the specific crates you need (all share one version):
          hologram-compiler = { git = "https://github.com/Hologram-Technologies/hologram", tag = "v${{ needs.verify.outputs.version }}" }
          hologram-exec     = { git = "https://github.com/Hologram-Technologies/hologram", tag = "v${{ needs.verify.outputs.version }}" }
          hologram-compute  = { git = "https://github.com/Hologram-Technologies/hologram", tag = "v${{ needs.verify.outputs.version }}" }
          ```

          #### CLI Binary

          Download the appropriate binary for your platform from the assets below and add it to your PATH.

          #### Source provenance

          The deterministic source archive and commit manifest are signed with GitHub OIDC build
          provenance. Verify them with `gh attestation verify <file> --repo Hologram-Technologies/hologram`;
          the unsigned Git tag is a locator, not the release trust root.

          ### Changes

          EOF

          if [ -n "$PREV_TAG" ]; then
            echo "#### Commits since ${PREV_TAG}" >> release_notes.md
            echo "" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-assets/*
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(needs.verify.outputs.version, 'alpha') || contains(needs.verify.outputs.version, 'beta') || contains(needs.verify.outputs.version, 'rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## ✅ Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ needs.verify.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Distribution Methods" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. **Git Dependency** (Recommended for Libraries)" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`toml" >> $GITHUB_STEP_SUMMARY
          echo "   hologram-exec = { git = \"https://github.com/Hologram-Technologies/hologram\", tag = \"v${{ needs.verify.outputs.version }}\" }" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. **Binary Download** (For CLI Tool)" >> $GITHUB_STEP_SUMMARY
          echo "   - Download from [GitHub Releases](https://github.com/Hologram-Technologies/hologram/releases/tag/v${{ needs.verify.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note on GitHub Packages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GitHub Packages does not currently support native Cargo/Rust registries." >> $GITHUB_STEP_SUMMARY
          echo "The git dependency approach above is the recommended method for private Rust crates." >> $GITHUB_STEP_SUMMARY
