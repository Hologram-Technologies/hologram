name: Publish · crates.io

# Publishes every publishable workspace crate to crates.io on a release tag, in dependency order.
# crates.io versions are PERMANENT, so publishing runs behind the `crates-io` GitHub Environment
# (configure it with a required reviewer). A missing token is a release failure, never a successful
# skip. Every third-party action and the Rust toolchain are immutable release inputs.
run-name: "Publish crates.io · ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and checksum-preflight the complete graph (no publish)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  publish:
    name: cargo publish (topological order)
    runs-on: ubuntu-24.04
    environment: crates-io       # approval gate — permanent publishes
    timeout-minutes: 120         # ~19 crates, each verified by cargo publish
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.98.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Require the exact-source release gate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-release-gate.sh
      - name: Require crates.io credentials
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required for a crates.io release"
            exit 1
          fi
      - name: cargo publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/publish-crates.sh
