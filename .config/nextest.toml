# The cucumber target has a custom harness and is routed explicitly by `just test`.
# No global default filter is permitted: a direct nextest invocation must never hide a test.

# Performance witnesses measure wall-clock throughput and must not compete with the other
# workspace binaries that nextest normally schedules in parallel. Reserving every test thread
# makes the measurement representative without filtering, ignoring, or relaxing any floor.
[[profile.default.overrides]]
filter = 'binary(performance)'
threads-required = "num-cpus"
