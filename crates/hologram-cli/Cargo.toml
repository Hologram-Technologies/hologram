[package]
name = "hologram-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hologram CLI: the one `hologram` binary — compile/execute/bench/inspect plus the deployment-substrate node (store/route/serve)."

[[bin]]
name = "hologram"
path = "src/main.rs"

[dependencies]
# The CLI is a host binary: it opts the otherwise-`no_std` library crates
# back into `std` and selects the CPU backend.
hologram-compiler = { workspace = true, features = ["std"] }
hologram-exec     = { workspace = true, features = ["std"] }
hologram-compute  = { workspace = true, features = ["std", "cpu"] }
hologram-archive  = { workspace = true, features = ["std"] }
hologram-graph    = { workspace = true }
clap              = { workspace = true }
# Hologram's CLI is an application-author surface; it consumes the
# prism façade per wiki ADR-031.
uor-prism         = { workspace = true }
# The `node` subcommand group (absorbed from the former hologram-substrate-cli, D13):
# a native redb store, the Wasmtime engine, and the live HTTP-CAS + κ-XOR DHT transports.
hologram-space        = { workspace = true }
hologram-store = { workspace = true, features = ["native"] }
hologram-runtime      = { workspace = true, features = ["engine-wasmtime"] }
hologram-net          = { workspace = true, features = ["live", "tcp"] }
pollster              = { workspace = true }
tokio                 = { version = "1", features = ["rt", "macros"] }
# ── Uncomment to build `--features ai` (and set `ai = ["dep:hologram-ai"]`
# below). Sibling-repo path during development; becomes a git pin once
# hologram-ai is published/pinned. Kept commented because an optional path dep
# on a non-existent path breaks workspace resolution even with the feature off.
# hologram-ai = { path = "../../../hologram-ai/crates/hologram-ai", optional = true }

[dev-dependencies]
# The node module's inline tests run against the reference MemKappaStore.
hologram-tck = { workspace = true }

[features]
default = []
frontend-python = ["hologram-compiler/frontend-python"]
frontend-rust = ["hologram-compiler/frontend-rust"]
frontend-typescript = ["hologram-compiler/frontend-typescript"]
# `hologram ai …` — AI application tooling (`.holo` v4 inference-model layers),
# delegating to the sibling `hologram-ai` crate. The dependency stays commented
# out (see [dependencies]) until hologram-ai is published/pinned. To enable:
# uncomment the dep AND change this to `ai = ["dep:hologram-ai"]`. Enabling `ai`
# without the dep is a deliberate compile error — no stub fallback. See src/ai.rs
# for the wiring + the assumed `hologram_ai::cli` API contract.
ai = []
