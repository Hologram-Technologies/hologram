[package]
name = "hologram-space"
# Not part of the 0.14.0 crates.io release set (see CHANGELOG 0.14.0). Publishing it later is purely additive.
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The hologram space contract: the trait surface a host implements to become a place hologram runs (specs/refactor/02)."

[dependencies]
# Absorbed from hologram-substrate-core (P1): the σ-axis (via hologram-types, no
# compute-engine dep) + uor-addr's κ-labels; hashbrown for the no_std maps; async-trait
# for the sync/HAL trait surfaces.
hologram-types = { workspace = true }
uor-addr = { workspace = true, features = ["alloc"] }
async-trait = { workspace = true }
spin = { workspace = true }
hashbrown = { workspace = true }
# The tree primitives (`blake3::guts`: chunk and parent chaining values) behind the 1 MiB piece
# table in `piece`. Same crate instance as the σ-axis hasher: `uor-prism-crypto` 0.4 holds the
# workspace at blake3 `>=1.5, <1.6`, so this range adds no second copy. `std` turns on blake3's
# runtime CPU detection (AVX2/AVX-512/SSE4.1); without it only compile-time features are used.
blake3 = { version = ">=1.5, <1.6", default-features = false }

[dev-dependencies]
pollster = { workspace = true }
# Independent reference impls for the AS-class σ-axis differential KATs (absorbed from core).
blake3 = "1"
sha2 = "0.10"
sha3 = "0.10"
# Reference `SignatureVerifier` for the R3 attestation seam (spec 07). A DEV-dependency only: the
# no_std core carries just the portable trait + signature bytes, so wasm32/thumbv7em portability
# builds never pull curve25519 — a real space provides its own verifier (hardware / WebCrypto).
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
# Reference `PayloadCipher` for the Private-tier payload encryption seam (spec 04). DEV-dependency
# only, same rationale — the no_std core carries just the portable trait + convergent nonce.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Reference `KeyWrapper` for the P6 forward-secrecy seam (spec 04 §Private): X25519 sealed-box key
# wrapping. DEV-dependency only — the no_std core carries just the portable trait. `static_secrets`
# gives deterministic (seeded) keys so the forward-secrecy test is reproducible / always-green.
x25519-dalek = { version = "2", default-features = false, features = ["alloc", "static_secrets"] }

[features]
default = ["std"]
std = ["uor-addr/std", "hologram-types/std", "blake3/std"]
