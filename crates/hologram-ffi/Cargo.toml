[package]
name = "hologram-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Hologram C ABI + WASM bindings."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Hologram's C ABI is an application-author surface; it imports the
# prism façade per wiki ADR-031 rather than the substrate directly.
# Host shared library: opts the library crates back into `std` + CPU backend.
hologram-compiler = { workspace = true, features = ["std"] }
hologram-exec     = { workspace = true, features = ["std"] }
hologram-archive  = { workspace = true, features = ["std"] }
hologram-compute  = { workspace = true, features = ["std", "cpu"] }
hologram-graph    = { workspace = true }
uor-prism         = { workspace = true }
# ── Uncomment to build `--features ai` (and set `ai = ["dep:hologram-ai"]`
# below). Sibling-repo path during development; becomes a git pin once
# hologram-ai is published/pinned. Kept commented because an optional path dep
# on a non-existent path breaks workspace resolution even with the feature off.
# hologram-ai = { path = "../../../hologram-ai/crates/hologram-ai", optional = true }

[dev-dependencies]
hologram-types = { workspace = true }
uor-prism     = { workspace = true }

[features]
default = []
wasm = []
# The `hologram_ai_*` C ABI surface (`.holo` v4 inference-model apps), delegating
# to the sibling `hologram-ai` crate. The dependency stays commented out (see
# [dependencies]) until hologram-ai is published/pinned. To enable: uncomment the
# dep AND change this to `ai = ["dep:hologram-ai"]`. Enabling `ai` without the
# dep is a deliberate compile error — no stub fallback. See src/ai.rs for the
# wiring + the assumed `hologram_ai::ffi` API contract.
ai = []
